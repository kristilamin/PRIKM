global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'my-project'

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9090','cadvisor:8080','node-exporter:9100']

  - job_name: 'jenkins'
    metrics_path: /prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['172.17.0.1:8080']
